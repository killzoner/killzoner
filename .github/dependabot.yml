---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 3
      # Keeps the v2 tag resolvable, so refs are not rewritten to exact versions
      exclude:
        - "taiki-e/install-action"
    groups:
      "all-deps":
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 99
